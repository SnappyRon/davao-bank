  <path class="ln" d="M400 630 V610 H445 V588"/><text class="lbl" x="340" y="602">upsert_fx_rates</text>
  <rect class="ext" x="560" y="748" width="240" height="60" rx="8"/><text class="t b" x="680" y="773">Frankfurter API</text><text class="t" x="680" y="795">ECB reference rates</text>
  <path class="ln" d="M445 690 V778 H558"/><text class="lbl" x="455" y="770">GET rates</text>
</svg>
