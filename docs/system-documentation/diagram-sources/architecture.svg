  <path d="M230 500 V570 A200 14 0 0 0 630 570 V500" fill="#E3F2E8" stroke="#0C6D38" stroke-width="1.5"/>
  <text class="t b" x="430" y="535">Tables (ledger is the source of truth)</text><text class="t" x="430" y="557">profiles · accounts · transactions · ledger_entries · audit_logs …</text>
  <path class="ln" d="M175 450 V480 H228"/><path class="ln" d="M445 450 V484"/>
  <!-- fx -->
  <rect class="box" x="60" y="630" width="220" height="60" rx="8"/><text class="t b" x="170" y="655">Vault secret</text><text class="t" x="170" y="677">FX_SYNC_SECRET</text>
  <rect class="box" x="330" y="630" width="230" height="60" rx="8"/><text class="t b" x="445" y="655">Edge Function fx-sync</text><text class="t" x="445" y="677">daily at 04:00 UTC</text>
